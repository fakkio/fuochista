<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#c2410c">
  <title>Fuochista</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="bar">
    <h1>Fuochista</h1>
    <span id="greeting"></span>
    <button id="logout" type="button">Esci</button>
  </header>
  <main class="card">
    <section id="stove" aria-labelledby="stove-title">
      <h2 id="stove-title">Stufa</h2>
      <p class="state" data-state="" data-testid="state">…</p>
      <dl class="readings">
        <dt>Potenza</dt><dd data-testid="power">–</dd>
        <dt>Ventola</dt><dd data-testid="fan">–</dd>
        <dt>Temperatura acqua impostata</dt><dd data-testid="water-setpoint">–</dd>
        <dt>Temperatura acqua attuale</dt><dd data-testid="water-temperature">–</dd>
      </dl>
      <p class="meta">Letto alle <span data-testid="read-at">–</span></p>
      <p class="error" role="alert" data-testid="error" hidden></p>
      <button id="refresh" type="button">Aggiorna</button>
    </section>
    <section id="programs" aria-labelledby="programs-title">
      <h2 id="programs-title">Programmi</h2>
      <p class="meta" data-testid="active-program">Nessun programma attivo</p>
      <button id="pause" type="button" hidden>Metti in pausa</button>
      <ul id="program-list" class="programs"></ul>
      <button id="new-program" type="button">Nuovo programma</button>
      <form id="program-editor" aria-label="Programma" hidden>
        <label>Nome <input name="name" required></label>
        <div id="day-groups"></div>
        <button id="add-group" type="button" class="secondary">Aggiungi gruppo di giorni</button>
        <p class="error" role="alert" hidden></p>
        <div class="actions">
          <button type="submit">Salva</button>
          <button id="cancel-edit" type="button" class="secondary">Annulla</button>
        </div>
      </form>
    </section>
  </main>
  <script src="/app.js" type="module"></script>
  <script src="/programs.js" type="module"></script>
</body>
</html>
